changelog:
  categories:
    # First so a breaking PR lands here even when it also carries a topic label.
    - title: Breaking
      labels:
        - breaking
    - title: Added
      labels:
        - enhancement
    - title: Changed
      labels:
        - changed
    - title: Fixed
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
