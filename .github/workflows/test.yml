name: Tests

# PR-only. The `push: [main]` trigger was removed: it re-ran the same suite the
# PR had already run. It did have one residual value — merges here are squashes,
# so the commit that lands on main is a new commit no PR run tested, and the main
# run caught a semantic conflict between two PRs merged in sequence. Nothing
# catches that now until the next PR runs, or until the Documentation build fails
# if the break is a compile error. Restore this trigger if one slips through.
on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-26
    # Observed 3m32s-3m46s. Without a cap the job inherits GitHub's six-hour
    # default, so one hung test holds a runner and blocks the merge all day.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # swift test resolves third-party packages and runs the Persnoop
          # build-tool plugin in this job. Without this the GITHUB_TOKEN stays
          # readable by every step after the checkout, including that plugin.
          persist-credentials: false

      - name: Test (Debug, with coverage)
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          BIN=$(swift build --show-bin-path)
          # Collect every test bundle: llvm-cov takes the first binary
          # positionally and the rest as -object flags, hence the shift.
          set --
          for bundle in "$BIN"/*.xctest; do
            set -- "$@" -object "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)"
          done
          shift
          xcrun llvm-cov report "$@" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -ignore-filename-regex='(Tests|\.build)/' \
            >> "$GITHUB_STEP_SUMMARY"

      # Release run guards against optimization-only regressions (e.g. generic
      # `#Predicate` miscompiles) that the Debug suite passes through silently.
      - name: Test (Release)
        run: swift test -c release

  # The package is macOS + iOS; swift test above only exercises macOS. This
  # job is build-only: every Xcode 26.x on the runner image mislinks the
  # host-built macro object into iOS *test* bundles ("building for
  # 'iOS-simulator', but linking in object file (SwiduxMacros.o) built for
  # 'macOS'"), so `xcodebuild test` cannot work until a fixed Xcode ships.
  # Building the library products still catches iOS-only compile breaks;
  # functional coverage runs on macOS.
  build-ios:
    runs-on: macos-26
    # Observed 1m32s-1m39s.
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See test-macos: xcodebuild runs the macro plugin in this job.
          persist-credentials: false

      # -skipMacroValidation: SwiduxMacros is a compiler plugin and xcodebuild
      # otherwise blocks on the interactive fingerprint-trust prompt.
      - name: Build (iOS Simulator)
        run: |
          xcodebuild build -scheme Swidux-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation

  # Build-only: CounterTests duplicate library suites; this guards the example
  # against API drift so the tutorial always compiles.
  build-example:
    runs-on: macos-26
    # Observed 2m45s-2m52s.
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See test-macos: xcodebuild runs the macro plugin in this job.
          persist-credentials: false

      - name: Build Examples/Counter (macOS)
        run: |
          xcodebuild build -project Examples/Counter/Counter.xcodeproj \
            -scheme Counter -destination 'platform=macOS' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
