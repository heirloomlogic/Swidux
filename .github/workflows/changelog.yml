name: Changelog

# GitHub Releases are the source of truth for release notes; CHANGELOG.md is a
# generated mirror so the history is readable from a checkout. Regenerating on
# every release publish/edit/delete means the file cannot drift, and there is no
# [Unreleased] section to mis-stamp — it only ever contains published releases.
#
# The commit lands directly on main. The main ruleset requires a pull request,
# and GITHUB_TOKEN holds no repository role, so this mints an installation token
# for the Heirloom Logic Changelog Bot app, which the ruleset names as a bypass
# actor. heirloomlogic is a user account, not an org, so there are no shared
# Actions secrets: each repo needs its own CHANGELOG_APP_ID variable,
# CHANGELOG_APP_PRIVATE_KEY secret, and ruleset bypass entry. This file and
# bin/generate-changelog carry nothing repo-specific and drop in unchanged.

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate CHANGELOG.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bin/generate-changelog "${{ github.repository }}"

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already current; nothing to push."
            exit 0
          fi
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # [skip ci] keeps this docs-only commit from re-running lint, tests,
          # and the DocC deploy, none of which it can affect.
          git commit -m "Docs: regenerate CHANGELOG.md from GitHub Releases [skip ci]"
          git push origin HEAD:main
