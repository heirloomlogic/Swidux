name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A deploy, so runs serialise rather than cancel: killing a gh-pages publish
# halfway leaves the branch in a half-written state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    # Observed 6m00s.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job resolves third-party packages and runs the Persnoop
          # build-tool plugin and the DocC command plugin — package code we
          # don't fully control. It only produces a static docs artifact and
          # never needs write access, so it keeps `contents: read`.
          persist-credentials: false

      - name: Clean docs directory
        run: rm -rf ./docs

      - name: Enable dev tooling
        run: touch .dev-tooling

      # Combined documentation publishes every library product (not just the
      # core Swidux target) to one archive with a shared index; the existing
      # /documentation/swidux/ URLs are preserved. Targets are listed
      # explicitly — without the list, the combined build walks dependency
      # targets (swift-syntax, the macro implementation) and fails on the
      # duplicate SwiduxMacros target name.
      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target Swidux \
            --target SwiduxAnalytics \
            --target SwiduxFeatureFlags \
            --target SwiduxKillswitch \
            --target SwiduxParentalGate \
            --target SwiduxPaywall \
            --target SwiduxDevPaywallUI \
            --target SwiduxPersistence \
            --target SwiduxCloudKitSync \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path /Swidux \
            --output-path ./docs

      - name: Create .nojekyll file
        run: touch ./docs/.nojekyll

      # upload-artifact rejects any path containing `"`, `:`, `<`, `>`, `|`, `*`,
      # `?` or a line break (an NTFS portability rule), and DocC names its
      # per-symbol JSON after the signature, e.g. `data(for:session:).json`.
      # Uploading the tree directly fails, so ship it as one archive; the
      # archive's own name is clean and tar keeps the filenames byte-for-byte.
      # COPYFILE_DISABLE stops bsdtar adding `._*` AppleDouble entries.
      - name: Archive docs
        run: COPYFILE_DISABLE=1 tar -czf docs.tar.gz -C docs .

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docs.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # This job runs no package code — it only moves the artifact the build
    # job already produced onto gh-pages — so it's the only place that holds
    # write access.
    permissions:
      contents: write
    steps:
      # `github-pages-deploy-action` pushes via a local git checkout, but this
      # job never builds or resolves the package — the docs directory below
      # comes entirely from the `build` job's artifact.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: ${{ runner.temp }}/docs-artifact

      # The archive carries `.nojekyll` and the colon-bearing filenames, so
      # extracting it (rather than uploading a bare tree) is what preserves
      # both. Without `.nojekyll`, a recreated gh-pages branch (or a fork)
      # would publish through Jekyll, which drops every `_`/`.`-prefixed path.
      - name: Extract docs
        run: |
          mkdir docs
          tar -xzf "${{ runner.temp }}/docs-artifact/docs.tar.gz" -C docs
          test -f docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          # Named explicitly because the checkout above sets
          # persist-credentials: false. The action's `token` input already
          # defaults to github.token, but relying on that default would make
          # this deploy break silently if the default ever changed.
          token: ${{ github.token }}
          branch: gh-pages
          folder: docs
